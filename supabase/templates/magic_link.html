<!-- Local dev only. The app signs in with a 6-digit code, never a link, so the
     local mailbox has to show {{ .Token }} the way the hosted project's
     template does. Without this, `supabase start` sends the stock magic-link
     email and there is no code to type into the login screen. -->
<h2>Republic of FLOW</h2>
<p>Your verification code is:</p>
<p style="font-size:28px;letter-spacing:6px"><strong>{{ .Token }}</strong></p>
<p>It expires in 10 minutes.</p>
